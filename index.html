<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner Check-in AISINDO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--brand:#16365c;--bg:#f3f5f8;--ink:#17212e;--mut:#5b6879;--line:#dde3ea;--ok:#1b7f4b;--bad:#b3261e;--warn:#a86400;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:21px}p.sub{margin:0 0 12px;color:var(--mut)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input{width:100%;padding:11px 12px;border:1px solid #c2cbd6;border-radius:8px;font:inherit}
input:focus,button:focus-visible{outline:3px solid #9ec1ea;outline-offset:1px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.btn.alt{background:#e8edf3;color:var(--brand)}.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:40px}
.res{border-radius:10px;padding:16px;color:#fff;margin-top:12px}.res h3{margin:0;font-size:24px}
.res dl{margin:10px 0 0;display:grid;grid-template-columns:100px 1fr;gap:2px 8px}.res dt{opacity:.85}.res dd{margin:0;font-weight:600}
.s-VALID{background:var(--ok)}.s-ALREADY_CHECKED_IN,.s-EVENT_CLOSED{background:var(--warn)}.s-INVALID,.s-NOT_ELIGIBLE{background:var(--bad)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92%;padding:12px 16px;border-radius:8px;color:#fff;background:var(--bad);display:none;z-index:9}
.hide{display:none!important}
</style></head>
<body>
<header><b>Scanner Check-in</b><button id="b-out" class="hide">Keluar</button></header>
<main>
<section id="v-login" class="card"><h2>Login panitia</h2><p class="sub">Masuk dengan akun panitia untuk mulai scan.</p>
<label for="l-user">Nama pengguna</label><input id="l-user" autocapitalize="none" autocomplete="username">
<label for="l-pin">PIN</label><input id="l-pin" type="password" autocomplete="current-password">
<button class="btn" id="b-login">Masuk</button></section>

<section id="v-scan" class="hide">
<div class="card"><p class="sub" id="who"></p><div id="reader"></div>
<div class="row"><button class="btn" id="b-start">Mulai kamera</button><button class="btn alt" id="b-stop">Hentikan</button></div></div>
<div id="res"></div>
<div class="card"><label for="s-id" style="margin-top:0">Kamera bermasalah? Masukkan ID peserta</label>
<div class="row"><input id="s-id" placeholder="AIS-WS26-0001" style="flex:1;min-width:170px"><button class="btn" id="b-man" style="margin-top:0">Check-in</button></div>
<label for="s-file">Atau foto QR dari layar peserta</label><input id="s-file" type="file" accept="image/*" capture="environment"><div id="reader2" class="hide"></div></div>
</section></main><div id="toast" role="status"></div>

<script>
/* Tempel URL web app Apps Script (berakhiran /exec) di sini */
const API_URL='https://script.google.com/macros/s/AKfycby65WS33wxaZBi9tVOxLi5hTZbW_XOMy6Pt6RkWt6-HcQbbS7ZwHDAMY3vv-j7jBBND/exec';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TL={D1:'Hari Pertama',D2:'Hari Kedua',BUNDLE:'Bundling Dua Hari'};
const SL={VALID:'VALID',ALREADY_CHECKED_IN:'SUDAH CHECK-IN',INVALID:'TIKET TIDAK VALID',NOT_ELIGIBLE:'TIDAK BERLAKU HARI INI',EVENT_CLOSED:'CHECK-IN DITUTUP'};
let S={sess:null,name:''},scanner=null,lock=false;
try{const x=JSON.parse(sessionStorage.getItem('s')||'null');if(x&&x.sess)S=x}catch(e){}

function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',5000)}
async function call(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json(); if(j.error)throw new Error(j.error); return j;
}
function view(){const on=!!S.sess;$('#v-login').classList.toggle('hide',on);$('#v-scan').classList.toggle('hide',!on);$('#b-out').classList.toggle('hide',!on);
  if(on)$('#who').textContent='Masuk sebagai '+S.name+'. Arahkan kamera ke QR tiket.'}
function logout(){stopScan();S={sess:null,name:''};try{sessionStorage.removeItem('s')}catch(e){};$('#res').innerHTML='';view()}

$('#b-login').onclick=async function(){const b=this;b.disabled=true;
  try{const r=await call({action:'login',user:$('#l-user').value,pin:$('#l-pin').value});
    if(!r.ok)return toast(r.msg);
    S={sess:r.token,name:r.name};try{sessionStorage.setItem('s',JSON.stringify(S))}catch(e){};$('#l-pin').value='';view()}
  catch(e){toast('Gagal terhubung: '+e.message)}finally{b.disabled=false}};
$('#b-out').onclick=logout;

async function check(v,manual){
  try{const r=await call({action:'checkin',sess:S.sess,value:v,manual:!!manual});
    $('#res').innerHTML='<div class="res s-'+r.status+'"><h3>'+SL[r.status]+'</h3><div>'+esc(r.msg)+'</div>'+(r.name?'<dl><dt>Nama</dt><dd>'+esc(r.name)+'</dd><dt>ID</dt><dd>'+esc(r.id)+'</dd><dt>Institusi</dt><dd>'+esc(r.institution)+'</dd><dt>Tiket</dt><dd>'+(TL[r.type]||'')+'</dd><dt>Hari acara</dt><dd>'+(r.day?'Hari ke-'+r.day:'-')+'</dd>'+(r.time?'<dt>Waktu</dt><dd>'+esc(r.time)+' WIB</dd>':'')+'</dl>':'')+'</div>';
    if(navigator.vibrate)navigator.vibrate(r.status==='VALID'?80:[100,60,100]);
  }catch(e){if(/Sesi|login/i.test(e.message)){toast(e.message);logout()}else toast('Gagal: '+e.message)}}

async function startScan(){
  if(scanner)return;
  try{scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},t=>{if(lock)return;lock=true;check(t,false).finally(()=>setTimeout(()=>lock=false,2500))},()=>{})}
  catch(e){scanner=null;toast('Kamera tidak bisa dibuka. Izinkan akses kamera di browser, atau pakai ID / foto QR.')}}
async function stopScan(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}}
$('#b-start').onclick=startScan;$('#b-stop').onclick=stopScan;
$('#b-man').onclick=function(){const v=$('#s-id').value.trim();if(v)check(v,true)};
$('#s-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const t=await new Html5Qrcode('reader2').scanFile(f,false);await check(t,false)}catch(x){toast('QR tidak terbaca. Foto ulang lebih dekat dan terang.')}e.target.value=''};
view();
</script></body></html>
